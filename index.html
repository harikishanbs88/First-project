!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home page</title>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Raleway:wght@300;400;600&amp;display=swap" rel="stylesheet">
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Raleway', sans-serif;
        }

        .hero {
            height: 100%;
            width: 100%;
            background:
                linear-gradient(135deg, rgba(15, 32, 39, 0.88) 0%, rgba(32, 58, 67, 0.75) 40%, rgba(44, 83, 100, 0.65) 100%),
                /* Geometric pattern via CSS */
                radial-gradient(circle at 20% 80%, rgba(255,180,100,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(100,200,255,0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 70%);
            background-color: #0f2027;
            display: flex;
            flex-direction: column;
            overflow: auto;
            position: relative;
        }

        /* Decorative silhouette shapes via pseudo-elements */
        .hero::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background:
                /* House silhouette */
                linear-gradient(135deg, transparent 33%, rgba(20,45,60,0.9) 33%, rgba(20,45,60,0.9) 34%, transparent 34%),
                linear-gradient(225deg, transparent 33%, rgba(20,45,60,0.9) 33%, rgba(20,45,60,0.9) 34%, transparent 34%),
                /* Buildings */
                linear-gradient(to top, rgba(15,35,50,0.95) 0%, rgba(15,35,50,0.95) 60%, transparent 60%) no-repeat 5% bottom / 8% 35%,
                linear-gradient(to top, rgba(18,40,55,0.9) 0%, rgba(18,40,55,0.9) 70%, transparent 70%) no-repeat 14% bottom / 6% 45%,
                linear-gradient(to top, rgba(12,30,45,0.95) 0%, rgba(12,30,45,0.95) 55%, transparent 55%) no-repeat 22% bottom / 10% 30%,
                linear-gradient(to top, rgba(20,45,60,0.85) 0%, rgba(20,45,60,0.85) 80%, transparent 80%) no-repeat 75% bottom / 7% 50%,
                linear-gradient(to top, rgba(15,38,52,0.9) 0%, rgba(15,38,52,0.9) 65%, transparent 65%) no-repeat 85% bottom / 9% 38%,
                /* Ground */
                linear-gradient(to top, rgba(10,25,38,1) 0%, rgba(10,25,38,0.8) 15%, transparent 30%);
            pointer-events: none;
            z-index: 0;
        }

        /* People silhouettes */
        .hero::after {
            content: '';
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 80px;
            background:
                /* Person 1 - head */
                radial-gradient(circle, rgba(10,25,38,1) 8px, transparent 8px) no-repeat 40px 0px / 20px 20px,
                /* Person 1 - body */
                linear-gradient(to top, rgba(10,25,38,1) 0%, rgba(10,25,38,1) 100%) no-repeat 44px 18px / 12px 40px,
                /* Person 1 - legs */
                linear-gradient(to top, rgba(10,25,38,1) 100%, transparent 100%) no-repeat 40px 55px / 8px 25px,
                linear-gradient(to top, rgba(10,25,38,1) 100%, transparent 100%) no-repeat 52px 55px / 8px 25px,

                /* Person 2 - head */
                radial-gradient(circle, rgba(10,25,38,1) 7px, transparent 7px) no-repeat 90px 5px / 18px 18px,
                /* Person 2 - body */
                linear-gradient(to top, rgba(10,25,38,1) 0%, rgba(10,25,38,1) 100%) no-repeat 94px 22px / 10px 38px,
                /* Person 2 - legs */
                linear-gradient(to top, rgba(10,25,38,1) 100%, transparent 100%) no-repeat 90px 57px / 7px 23px,
                linear-gradient(to top, rgba(10,25,38,1) 100%, transparent 100%) no-repeat 101px 57px / 7px 23px,

                /* Person 3 - head */
                radial-gradient(circle, rgba(10,25,38,1) 9px, transparent 9px) no-repeat 140px 2px / 22px 22px,
                /* Person 3 - body */
                linear-gradient(to top, rgba(10,25,38,1) 0%, rgba(10,25,38,1) 100%) no-repeat 145px 20px / 12px 42px,
                /* Person 3 - legs */
                linear-gradient(to top, rgba(10,25,38,1) 100%, transparent 100%) no-repeat 141px 58px / 8px 22px,
                linear-gradient(to top, rgba(10,25,38,1) 100%, transparent 100%) no-repeat 153px 58px / 8px 22px;
            pointer-events: none;
            z-index: 1;
        }

        .tab {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 48px;
            position: relative;
            z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(4px);
            background: rgba(255,255,255,0.03);
        }

        .tab h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #f0c27f;
            letter-spacing: 4px;
            text-shadow: 0 2px 20px rgba(240,194,127,0.3);
        }

        .tab ul {
            list-style: none;
            display: flex;
            gap: 36px;
        }

        .tab ul li a {
            text-decoration: none;
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 16px;
            position: relative;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .tab ul li a::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(240,194,127,0.2), rgba(252,92,125,0.1));
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .tab ul li a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 16px;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #f0c27f, #fc5c7d);
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-radius: 2px;
        }

        .tab ul li a:hover {
            color: #fff;
            transform: translateY(-2px);
        }

        .tab ul li a:hover::before {
            opacity: 1;
        }

        .tab ul li a:hover::after {
            width: calc(100% - 32px);
        }

        .tag {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 10;
            font-family: 'Playfair Display', serif;
            font-size: clamp(28px, 5vw, 64px);
            font-weight: 700;
            line-height: 1.3;
            color: #ffffff;
            text-transform: capitalize;
            letter-spacing: 1px;
            text-shadow: 0 4px 30px rgba(0,0,0,0.4);
            animation: fadeUp 1.2s ease-out;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating light particles */
        @keyframes float1 { 0%,100% { transform: translate(0,0); opacity:0.4; } 50% { transform: translate(20px,-30px); opacity:0.8; } }
        @keyframes float2 { 0%,100% { transform: translate(0,0); opacity:0.3; } 50% { transform: translate(-15px,-40px); opacity:0.7; } }

        @media (max-width: 640px) {
            .tab {
                flex-direction: column;
                gap: 16px;
                padding: 20px 24px;
                text-align: center;
            }
            .tab ul {
                gap: 20px;
            }
            .tag {
                padding: 24px;
            }
        }
    </style>
 
 </head>
 <body>
  <div class="hero">
   <nav class="tab">
    <h1>HOME</h1>
    <ul>
     <li><a href="home.html">HOME</a></li>
     <li><a href="https://gamma.app/">Gamma</a></li>
     <li><a href="hk.html">harikishan</a></li>
    </ul>
   </nav>
   <div class="tag">
    this is the home page we welcome you
   </div>
  </div>
 </body>
</html>
